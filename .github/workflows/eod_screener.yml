name: 🌇 EOD Coiled Spring Screener

on:
  schedule:
    # Runs at 6:00 PM IST (12:30 UTC), Monday-Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

permissions:
  contents: write # Required to save the database back to your repo

jobs:
  scan-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run EOD Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Automated_System.py --eod

      - name: Save Watchlist & Database back to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.db
          git commit -m "🤖 Auto-update NSE Warehouse & Watchlist DB [skip ci]" || echo "No changes to commit"
          git push
