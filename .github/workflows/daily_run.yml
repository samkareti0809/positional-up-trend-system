name: NSE Daily Scanner

on:
  schedule:
    # Runs at 10:30 UTC (4:00 PM IST) Monday through Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to save the DB back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_scanner.py
          
      - name: Commit Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_nse_warehouse.db
          # Only commit if the database actually changed
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update daily market data"
          
          # Pull any recent web edits so we don't get rejected
          git pull --rebase origin main
          
          git push
