name: 🚀 Intraday Ignition Scanner

on:
  schedule:
    # Runs at 04:45 UTC (10:15 AM IST) Monday-Friday
    - cron: '45 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt-elephants:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run Intraday Elephant Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Automated_System.py --intraday

      - name: Update Watchlist Triggers
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.db
          git commit -m "🤖 Auto-update Watchlist Triggers [skip ci]" || echo "No changes to commit"
          git push
